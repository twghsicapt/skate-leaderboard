<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全港校際滑板比賽2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg-color: #f9f9f9; --accent-color: #000000; }
        body { font-family: sans-serif; background: var(--bg-color); }
        #app { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
        header { padding: 20px; background: white; text-align: center; border-bottom: 1px solid #ddd; }
        .tabs { display: flex; background: white; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; font-weight: 700; color: #888; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }
        .board-container { padding: 16px; display: none; }
        .board-container.active { display: block; }
        .rank-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .category-title { font-size: 1.1rem; font-weight: 800; margin: 20px 0 10px; border-bottom: 2px solid #000; padding-bottom: 5px; }
        .empty-state { text-align: center; padding: 20px; color: #888; background: #eee; border-radius: 8px; margin-bottom: 10px; }
        #admin-trigger { position: fixed; bottom: 20px; right: 20px; background: black; color: white; border-radius: 50%; width: 50px; height: 50px; z-index: 9999; }
        #admin-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: none; padding: 20px; z-index: 10000; overflow-y: auto; }
        .dynamic-input { display: none; }
        .dynamic-input.active { display: block; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>全港校際滑板比賽2026</h1>
            <div id="connection-status">🟡 連接中...</div>
        </header>
        <nav class="tabs">
            <button class="tab-btn active" data-target="speed" onclick="switchTab('speed')">速度</button>
            <button class="tab-btn" data-target="ollie" onclick="switchTab('ollie')">豚跳</button>
            <button class="tab-btn" data-target="street" onclick="switchTab('street')">街式</button>
        </nav>
        <main>
            <div id="speed" class="board-container active"></div>
            <div id="ollie" class="board-container"></div>
            <div id="street" class="board-container"></div>
        </main>
        <button id="admin-trigger" onclick="document.getElementById('admin-panel').style.display='block'">⚙️</button>
        <section id="admin-panel">
            <button onclick="document.getElementById('admin-panel').style.display='none'">關閉後台</button>
            <form id="score-form">
                <select id="event-select" onchange="updateInputs()">
                    <option value="speed">速度障礙</option>
                    <option value="ollie">豚跳鬥高</option>
                    <option value="street">街式滑板</option>
                </select>
                <input type="text" id="skater-id" placeholder="選手編號" required>
                <input type="text" id="skater-name" placeholder="姓名" required>
                <select id="round-select"><option value="第一輪">第一輪</option><option value="第二輪">第二輪</option></select>
                <div id="input-speed" class="dynamic-input active"><input type="number" step="0.01" id="score-speed" placeholder="秒數"></div>
                <div id="input-ollie" class="dynamic-input"><input type="number" id="score-ollie" placeholder="塊數"></div>
                <div id="input-street" class="dynamic-input"><input type="number" id="score-run" placeholder="Run"><input type="number" id="score-trick" placeholder="Trick"></div>
                <button type="submit">提交</button>
            </form>
        </section>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAxY9yLSVqxn90fv4d78cLLxtCjmcty-yc",
          authDomain: "skate-jam-2026-1aae7.firebaseapp.com",
          databaseURL: "https://skate-jam-2026-1aae7-default-rtdb.firebaseio.com/",
          projectId: "skate-jam-2026-1aae7",
          storageBucket: "skate-jam-2026-1aae7.firebasestorage.app",
          messagingSenderId: "405275333819",
          appId: "1:405275333819:web:9649701c3160f2e781c59e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function switchTab(target) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.board-container').forEach(c => c.classList.remove('active'));
            document.querySelector(`button[data-target="${target}"]`).classList.add('active');
            document.getElementById(target).classList.add('active');
        }

        function updateInputs() {
            const event = document.getElementById('event-select').value;
            document.querySelectorAll('.dynamic-input').forEach(el => el.classList.remove('active'));
            document.getElementById('input-' + event).classList.add('active');
        }

        // 🟢 最重要的渲染函數
        db.ref('skate_jam_2026_scores').on('value', (snapshot) => {
            document.getElementById('connection-status').innerText = "🟢 連線成功！";
            const data = snapshot.val() || {};
            
            ['speed', 'ollie', 'street'].forEach(evt => {
                const container = document.getElementById(evt);
                container.innerHTML = '<h3 class="category-title">成績榜</h3>';
                
                if (!data[evt]) {
                    container.innerHTML += '<div class="empty-state">暫無成績</div>';
                    return;
                }
                
                Object.values(data[evt]).forEach(player => {
                    container.innerHTML += `
                        <div class="rank-card">
                            <div><strong>${player.id}</strong> ${player.name}</div>
                            <div>成績已上傳</div>
                        </div>
                    `;
                });
            });
        });

        document.getElementById('score-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const event = document.getElementById('event-select').value;
            const id = document.getElementById('skater-id').value;
            const round = document.getElementById('round-select').value;
            const name = document.getElementById('skater-name').value;
            
            db.ref(`skate_jam_2026_scores/${event}/${id}`).update({
                id: id,
                name: name,
                [round]: '已上傳' // 這裡簡化了邏輯，你可以之後再擴充細節
            }).then(() => alert("提交成功！"));
        });
    </script>
</body>
</html>
