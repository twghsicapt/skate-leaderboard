<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>連線測試</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <h1 id="status">正在初始化連線...</h1>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAxY9yLSVqxn90fv4d78cLLxtCjmcty-yc",
          authDomain: "skate-jam-2026-1aae7.firebaseapp.com",
          databaseURL: "https://skate-jam-2026-1aae7-default-rtdb.firebaseio.com/",
          projectId: "skate-jam-2026-1aae7",
          storageBucket: "skate-jam-2026-1aae7.firebasestorage.app",
          messagingSenderId: "405275333819",
          appId: "1:405275333819:web:9649701c3160f2e781c59e"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            
            // 強制測試連線
            db.ref('.info/connected').on('value', function(snap) {
                document.getElementById('status').innerText = snap.val() ? "🟢 連線成功！" : "🔴 連接中...";
            });
        } catch(e) {
            document.getElementById('status').innerText = "❌ 錯誤: " + e.message;
        }
    </script>
</body>
</html>
